<!DOCTYPE html>
<html lang="{{language}}" data-theme="light">
<head profile="http://www.w3.org/2005/10/profile">
    <meta charset="UTF-8">
    <meta name="description" content="{{description}}">
    <meta name="author" content="Juan Raphael Diaz Simões">
    <meta name="keywords" content="Haskell, functional programming, software engineering, bioinformatics, performance optimization, Juan Simões">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <title>{{title}}</title>
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="{{#isPost}}article{{/isPost}}{{^isPost}}website{{/isPost}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{baseUrl}}{{currentUrl}}">
    <meta property="og:site_name" content="Juan Raphael Diaz Simões">
    <meta property="og:image" content="{{ogImage}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Juan Raphael Diaz Simões — Senior Backend / Platform Engineer">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{title}}">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{ogImage}}">

    <!-- Icons -->
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/images/juan.png">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{baseUrl}}{{currentUrl}}">
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "{{#isPost}}BlogPosting{{/isPost}}{{^isPost}}WebSite{{/isPost}}",
      "name": "{{title}}",
      "description": "{{description}}",
      "url": "{{baseUrl}}{{currentUrl}}",
      {{#isPost}}
      "author": {
        "@type": "Person",
        "name": "Juan Raphael Diaz Simões",
        "url": "{{baseUrl}}"
      },
      "publisher": {
        "@type": "Person",
        "name": "Juan Raphael Diaz Simões"
      },
      {{/isPost}}
      {{^isPost}}
      "author": {
        "@type": "Person",
        "name": "Juan Raphael Diaz Simões",
        "jobTitle": "Software Engineer",
        "knowsAbout": ["Haskell", "Functional Programming", "Bioinformatics", "Performance Optimization"],
        "url": "{{baseUrl}}"
      },
      {{/isPost}}
      "inLanguage": "{{language}}"
    }
    </script>
    <!-- Compiled locally from tailwind/input.css. First, so that the reset and
         the utilities are what the two sheets below override — which is where
         the CDN build it replaced injected itself. -->
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/syntax.css">

    {{#latex}}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71HotJqlAn" crossorigin="anonymous">

    <!-- The loading of KaTeX is deferred to speed up page rendering -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" integrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfFr4dgmgccOTx" crossorigin="anonymous"></script>

    <!-- To automatically render math in text elements, include the auto-render extension: -->
    <script>document.addEventListener("DOMContentLoaded", function () {
   var mathElements = document.getElementsByClassName("math");
   var macros = [];
   for (var i = 0; i < mathElements.length; i++) {
    var texText = mathElements[i].firstChild;
    if (mathElements[i].tagName == "SPAN") {
     katex.render(texText.data, mathElements[i], {
      displayMode: mathElements[i].classList.contains('display'),
      throwOnError: false,
      macros: macros,
      fleqn: false
     });
  }}});
    </script>
    {{/latex}}

</head>
<body data-page="{{page}}">
    {{>site/templates/header.html}}
    {{{content}}}
</body>
</html>
