<div class="md:flex justify-center bg-base-100">
    <article class="prose max-w-prose">
        <h1 class="text-3xl mb-2">Technical Articles</h1>

        <p class="text-sm text-slate-600 mb-6">On various subjects.</p>

        <div class="entry-list">
            {{#posts}}
            <article class="entry">
                <div class="entry-head">
                    <h3 class="entry-title"><a href="{{url}}">{{title}}</a></h3>
                    <span class="entry-date">{{date}}</span>
                </div>
                {{#summary}}
                <p class="entry-summary">{{summary}}</p>
                {{/summary}}
                {{#tags}}
                <div class="entry-tags">{{#tagList}}<span class="entry-tag">{{.}}</span>{{/tagList}}</div>
                {{/tags}}
            </article>
            {{/posts}}
        </div>

        <p class="text-sm text-slate-600 mt-6">
            Looking for essays and less technical writing? Visit <a href="/texts">Texts</a>.
        </p>

    </article>
</div>
