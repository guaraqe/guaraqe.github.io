<div class="md:flex justify-center bg-base-100">
    <article class="prose max-w-prose">
        <h1 class="text-3xl mb-2">Texts</h1>

        <p class="text-sm text-slate-600 mb-6">Essays, stories, fragments, and other writing in Portuguese and English.</p>

        <div class="entry-list">
            {{#posts}}
            <article class="entry">
                <div class="entry-head">
                    <h3 class="entry-title"><a href="{{url}}">{{title}}</a></h3>
                    <span class="entry-date">{{date}}</span>
                </div>
                {{#summary}}
                <p class="entry-summary">{{summary}}</p>
                {{/summary}}
            </article>
            {{/posts}}
        </div>
    </article>
</div>
